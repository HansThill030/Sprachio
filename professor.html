<style>
.teacher-shell{display:grid;grid-template-columns:220px minmax(0,1fr);gap:26px;align-items:start;margin-top:24px}.teacher-nav{position:sticky;top:18px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:9px}.teacher-nav-title{padding:10px 12px 12px;font:700 .95rem 'Space Grotesk',sans-serif}.teacher-nav button{width:100%;text-align:left;border:0;background:transparent;color:var(--ink-soft);padding:10px 12px;border-radius:var(--r-sm);font:600 .82rem Inter,sans-serif;cursor:pointer}.teacher-nav button:hover,.teacher-nav button.active{background:var(--surface-soft);color:var(--ink)}.teacher-nav .sep{height:1px;background:var(--line);margin:8px 0}.teacher-content{min-width:0}.teacher-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:20px}.teacher-head h2{margin:0 0 5px}.teacher-head p{margin:0;color:var(--ink-soft);font-size:.86rem}.teacher-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-bottom:18px}.teacher-kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px}.teacher-kpi .v{font:700 1.4rem 'Space Grotesk',sans-serif}.teacher-kpi .l{font-size:.7rem;color:var(--ink-faint);margin-top:3px}.teacher-section{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:17px;margin-bottom:16px}.teacher-section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px}.teacher-section-head h3{margin:0;font:700 .98rem 'Space Grotesk',sans-serif}.teacher-section-head span{font-size:.7rem;color:var(--ink-faint)}.class-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:9px}.class-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;cursor:pointer;transition:.15s}.class-card:hover{background:var(--surface-soft);transform:translateY(-1px)}.class-name{font:700 1rem 'Space Grotesk',sans-serif}.class-code{font:600 .7rem 'Space Grotesk',sans-serif;color:var(--accent);margin-top:4px;letter-spacing:.06em}.class-meta{display:flex;gap:14px;margin-top:12px;font-size:.73rem;color:var(--ink-faint)}.class-open{margin-top:13px;color:var(--accent);font-size:.75rem;font-weight:700}.create-row{display:flex;gap:8px}.create-row input{flex:1;min-width:0;padding:11px 13px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card);color:var(--ink);font:inherit;outline:none}.analytics-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.analytics-card{background:var(--surface-soft);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px}.analytics-card .v{font:700 1.15rem 'Space Grotesk',sans-serif}.analytics-card .l{font-size:.66rem;color:var(--ink-faint)}.empty-state{padding:25px;text-align:center;color:var(--ink-soft);border:1px dashed var(--line);border-radius:var(--r-sm)}@media(max-width:800px){.teacher-shell{grid-template-columns:1fr}.teacher-nav{position:static;display:flex;overflow:auto;padding:5px}.teacher-nav-title,.teacher-nav .sep{display:none}.teacher-nav button{width:auto;white-space:nowrap}.teacher-kpis{grid-template-columns:1fr 1fr}.analytics-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:520px){.teacher-head{flex-direction:column}.analytics-grid{grid-template-columns:1fr 1fr}.create-row{flex-direction:column}}
</style>

<body>
<div class="wrap" role="main">

  <div class="masthead">
    <a class="brand" href="/">
      <img src="assets/mark.png" alt="Sprachio" width="53" height="60">
      <span><span class="name">SPRACHIO</span></span>
    </a>
    <div class="header-actions">
      <span id="userEmail" style="font-size:0.8rem;color:var(--ink-faint);"></span>
      <a class="home-link" href="/trainer-hub">← Início</a>
    </div>
  </div>

  <div id="app">
    <div class="hist-loading">Carregando&hellip;</div>
  </div>

  <div class="disclaimer">Área do professor — acompanhe o progresso das suas turmas e envie atividades.</div>
</div>

<script src="js/config.js"></script>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = window.SCHREIBTRAINER_CONFIG?.SUPABASE_URL || "";
const SUPABASE_KEY = window.SCHREIBTRAINER_CONFIG?.SUPABASE_ANON_KEY || "";
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const { data: { session } } = await supabase.auth.getSession();
if (!session) { location.href = '/login'; }

const $ = id => document.getElementById(id);
function escapeHtml(str){ const d=document.createElement('div'); d.textContent = str || ''; return d.innerHTML; }
const NIVEAU_LABELS = { A2:'IVA 2', B1:'DSD I', C1:'DSD II' };
function niveauLabel(n){ return NIVEAU_LABELS[n] || n; }

const userEl = $('userEmail');
if (userEl && session) userEl.textContent = session.user.email;

function sbFetch(path, options={}){
  const headers=Object.assign({
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + session.access_token,
    'Content-Type':'application/json'
  }, options.headers||{});
  return fetch(`${SUPABASE_URL}/rest/v1/${path}`, Object.assign({}, options, { headers }));
}

function niveauParaNum(n){
  const m={'A2':1,'A2+':1.5,'B1-':1.8,'B1':2,'B1+':2.5,'B2-':2.8,'B2':3,'B2+':3.5,'C1-':3.8,'C1':4,'C1+':4.5};
  return m[n]||0;
}

function gerarCodigo(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c = '';
  for (let i=0;i<6;i++) c += chars[Math.floor(Math.random()*chars.length)];
  return c;
}

let ehProfessor = false;
let turmas = [];
let turmaAtual = null;

async function garantirMFA() {
  const { data: aal, error } = await supabase.auth.mfa.getAuthenticatorAssuranceLevel();
  if (error) throw error;
  if (aal?.currentLevel !== 'aal2') {
    location.replace('/mfa');
    return false;
  }
  return true;
}

async function init(){
  try {
    const res = await sbFetch(`perfis?user_id=eq.${session.user.id}&select=role`);
    const data = await res.json();
    ehProfessor = Array.isArray(data) && data.length > 0 && ['teacher','admin'].includes(data[0].role);
  } catch(e) { ehProfessor = false; }

  if (!ehProfessor) {
    $('app').innerHTML = `<div class="no-access">
      <div style="font-size:2.4rem;margin-bottom:14px;">🔒</div>
      <p>Esta página é exclusiva para professores.<br>Se você é professor e precisa de acesso, peça ao administrador para liberar sua conta.</p>
    </div>`;
    return;
  }

  await carregarTurmas();
  renderHome();
}

async function carregarTurmas(){
  const res = await sbFetch(`turmas?professor_id=eq.${session.user.id}&select=*&order=created_at.desc`);
  turmas = await res.json();
  if (!Array.isArray(turmas)) turmas = [];
  // Conta membros por turma
  for (const t of turmas) {
    try {
      const r = await sbFetch(`turma_membros?turma_id=eq.${t.id}&select=user_id`);
      const membros = await r.json();
      t._count = Array.isArray(membros) ? membros.length : 0;
      try {
        const a = await sbFetch(`aufgabas_turma?turma_id=eq.${t.id}&select=id`);
        const tarefas = await a.json();
        t._aufgaben = Array.isArray(tarefas) ? tarefas.length : 0;
        const e = await sbFetch(`entregas_turma?turma_id=eq.${t.id}&select=id`);
        const entregas = await e.json();
        t._entregas = Array.isArray(entregas) ? entregas.length : 0;
      } catch(e) { t._aufgaben = 0; }
    } catch(e) { t._count = 0; }
  }
}


async function carregarAnalyticaProfessor(){
  const grid=$('teacherAnalyticsGrid'), focus=$('teacherAnalyticsFocus');
  if(!grid||!focus) return;
  try{
    const ids=[];
    for(const t of turmas){
      const r=await sbFetch('turma_membros?turma_id=eq.'+encodeURIComponent(t.id)+'&select=user_id');
      const ms=await r.json(); if(Array.isArray(ms)) ms.forEach(m=>{if(m.user_id&&!ids.includes(m.user_id))ids.push(m.user_id);});
    }
    if(!ids.length){grid.innerHTML='<div style="color:var(--ink-faint);font-size:.8rem;">Ainda não há dados de alunos.</div>';return;}
    const inIds=ids.map(id=>'"'+id+'"').join(',');
    const [rh,re]=await Promise.all([
      sbFetch('historico?user_id=in.('+inIds+')&select=user_id,nivel_atingido,status,created_at'),
      sbFetch('erros_aprendizagem?user_id=in.('+inIds+')&select=user_id,subcategoria,created_at')
    ]);
    const hist=rh.ok?await rh.json():[]; const errs=re.ok?await re.json():[];
    const h=Array.isArray(hist)?hist:[], e=Array.isArray(errs)?errs:[];
    const active30=new Set(h.filter(x=>Date.now()-new Date(x.created_at).getTime()<=30*86400000).map(x=>x.user_id)).size;
    const reached=h.filter(x=>['erreicht','übertroffen'].includes(x.status)||String(x.nivel_atingido||'').includes('erreicht')).length;
    grid.innerHTML=[
      [ids.length,'Alunos'],[h.length,'Correções'],[active30,'Ativos nos últimos 30 dias'],[reached,'Resultados alcançados'],[e.length,'Erros identificados']
    ].map(x=>'<div class="teacher-analytics-card"><div class="v">'+escapeHtml(String(x[0]))+'</div><div class="l">'+escapeHtml(x[1])+'</div></div>').join('');
    const counts=new Map();e.forEach(x=>{const k=x.subcategoria||'Grammatik';counts.set(k,(counts.get(k)||0)+1);});
    const top=[...counts.entries()].sort((a,b)=>b[1]-a[1]).slice(0,3);
    focus.innerHTML=top.length?'Principais áreas de estudo: <strong>'+top.map(x=>escapeHtml(x[0])+' ('+x[1]+'×)').join(' · ')+'</strong>':'Ainda não há dados de erros.';
  }catch(err){console.error('Análise das turmas:',err);grid.innerHTML='<div style="color:var(--ink-faint);font-size:.8rem;">Não foi possível carregar a análise.</div>';}
}

function renderHome(){
  turmaAtual=null;
  $('app').innerHTML='<div class="teacher-shell"><aside class="teacher-nav"><div class="teacher-nav-title">Área do professor</div><button class="active" data-nav="overview">Visão geral</button><button data-nav="classes">Minhas turmas</button><button data-nav="analytics">Análise</button><div class="sep"></div><button id="navCreate">+ Criar turma</button></aside><main class="teacher-content"><div class="teacher-head"><div><h2 class="screen-title">Visão geral</h2><p>Gerencie suas turmas e acompanhe o aprendizado dos alunos.</p></div><button class="primary" id="btnPrimaryAction">Criar atividade</button></div><div class="teacher-kpis"><div class="teacher-kpi"><div class="v">'+turmas.length+'</div><div class="l">Turmas</div></div><div class="teacher-kpi"><div class="v">'+turmas.reduce((n,t)=>n+(t._count||0),0)+'</div><div class="l">Alunos</div></div><div class="teacher-kpi"><div class="v">'+turmas.reduce((n,t)=>n+(t._aufgaben||0),0)+'</div><div class="l">Atividades</div></div><div class="teacher-kpi"><div class="v">'+turmas.reduce((n,t)=>n+(t._entregas||0),0)+'</div><div class="l">Entregas</div></div></div><section class="teacher-section" id="analyticsSection"><div class="teacher-section-head"><h3>Análise rápida</h3><span>Suas turmas</span></div><div class="analytics-grid" id="teacherAnalyticsGrid"><div style="color:var(--ink-faint);font-size:.8rem">Calculando…</div></div><div id="teacherAnalyticsFocus" style="margin-top:11px;font-size:.8rem;color:var(--ink-soft)"></div></section><section class="teacher-section" id="classesSection"><div class="teacher-section-head"><h3>Minhas turmas</h3><span>'+turmas.length+' turma(s)</span></div><div class="class-grid" id="turmaGrid"></div></section><section class="teacher-section" id="createSection" style="display:none"><div class="teacher-section-head"><h3>Criar nova turma</h3><span>Os alunos entrarão usando o código gerado.</span></div><div class="create-row"><input id="inputNomeTurma" placeholder="Nome da turma (ex.: 9A Alemão)"><button class="primary" id="btnCriarTurma">Criar turma</button></div></section></main></div>';
  const grid=$('turmaGrid');
  grid.innerHTML=turmas.length?turmas.map(t=>'<div class="class-card" data-id="'+t.id+'"><div class="class-name">'+escapeHtml(t.nome)+'</div><div class="class-code">Código '+escapeHtml(t.codigo)+'</div><div class="class-meta"><span>'+(t._count||0)+' alunos</span><span>'+(t._aufgaben||0)+' atividades</span></div><div class="class-open">Abrir turma →</div></div>').join(''):'<div class="empty-state">Nenhuma turma criada ainda.</div>';
  grid.querySelectorAll('.class-card').forEach(c=>c.addEventListener('click',()=>abrirTurma(c.dataset.id)));
  carregarAnalyticaProfessor();
  document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-nav]').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(b.dataset.nav==='classes')$('classesSection').scrollIntoView({behavior:'smooth'});if(b.dataset.nav==='analytics')$('analyticsSection').scrollIntoView({behavior:'smooth'});}));
  $('navCreate').addEventListener('click',()=>{const el=$('createSection');el.style.display=el.style.display==='none'?'block':'none';if(el.style.display==='block')el.scrollIntoView({behavior:'smooth'});});
  $('btnPrimaryAction').addEventListener('click',()=>turmas.length?abrirTurma(turmas[0].id):$('navCreate').click());
  $('btnCriarTurma').addEventListener('click',criarTurma);
  $('inputNomeTurma').addEventListener('keydown',e=>{if(e.key==='Enter')criarTurma();});
}async function criarTurma(){
  const nome = $('inputNomeTurma').value.trim();
  if (!nome) return;
  const codigo = gerarCodigo();
  try {
    await sbFetch('turmas', {
      method: 'POST',
      headers: { Prefer: 'return=minimal' },
      body: JSON.stringify({ professor_id: session.user.id, nome, codigo })
    });
    await carregarTurmas();
    renderHome();
  } catch(e) {
    alert('Não foi possível criar a turma.');
  }
}

async function abrirTurma(turmaId){
  turmaAtual = turmas.find(t => t.id === turmaId);
  if (!turmaAtual) return;

  $('app').innerHTML = `<div class="hist-loading">Carregando&hellip;</div>`;

  // Membros
  const resM = await sbFetch(`turma_membros?turma_id=eq.${turmaId}&select=user_id,joined_at`);
  const membros = await resM.json();

  // Nomes dos alunos (vem do perfil público mínimo, não do auth.users)
  let perfis = [];
  if (membros.length) {
    const ids = membros.map(m => `\"${m.user_id}\"`).join(',');
    const resP = await sbFetch(`perfis?user_id=in.(${ids})&select=user_id,nome`);
    perfis = await resP.json();
    if (!Array.isArray(perfis)) perfis = [];
  }

  // Histórico completo dos membros (RLS já garante que só vejo alunos das minhas turmas)
  let historicoTodos = [];
  if (membros.length) {
    const ids = membros.map(m => `"${m.user_id}"`).join(',');
    const resH = await sbFetch(`historico?user_id=in.(${ids})&select=*&order=created_at.desc`);
    historicoTodos = await resH.json();
    if (!Array.isArray(historicoTodos)) historicoTodos = [];
  }

  // Atividades da turma
  const resA = await sbFetch(`aufgabas_turma?turma_id=eq.${turmaId}&select=*&order=created_at.desc`);
  const aufgabenTurma = await resA.json();

  const resE = await sbFetch(`entregas_turma?turma_id=eq.${turmaId}&select=*&order=enviado_em.desc`);
  const entregasTurma = await resE.json();

  const alunosStats = membros.map(m => {
    const registros = historicoTodos.filter(h => h.user_id === m.user_id);
    const melhor = registros.reduce((best, r) => niveauParaNum(r.nivel_atingido) > niveauParaNum(best) ? r.nivel_atingido : best, '');
    const ultima = registros[0]?.created_at ? new Date(registros[0].created_at).toLocaleDateString('de-DE') : '—';
    const perfil = perfis.find(p => p.user_id === m.user_id);
    const entregasAluno = Array.isArray(entregasTurma) ? entregasTurma.filter(e => e.aluno_id === m.user_id) : [];
    const entregues = new Set(entregasAluno.map(e => e.tarefa_id).filter(Boolean)).size;
    const pendentes = Math.max(aufgabenTurma.length - entregues, 0);
    const ultimaEntrega = entregasAluno[0]?.enviado_em ? new Date(entregasAluno[0].enviado_em) : null;
    const ultimaData = ultimaEntrega || (registros[0]?.created_at ? new Date(registros[0].created_at) : null);
    return { user_id: m.user_id, nome: perfil?.nome || 'alunos', melhor, count: entregasAluno.length, entregues, pendentes, totalAufgaben: aufgabenTurma.length, historicoCount: registros.length, ultima: ultimaData ? ultimaData.toLocaleDateString('de-DE') : '—' };
  });

  $('app').innerHTML = `
    <button class="ghost" id="btnVoltar" style="margin-bottom:18px;">← Alle Turman</button>
    <h2 class="screen-title" style="margin-bottom:14px;">${escapeHtml(turmaAtual.nome)}</h2>

    <div class="codigo-box" id="codigoBox">${escapeHtml(turmaAtual.codigo)}<small>Beitrittscode — antippen zum Kopieren</small></div>

    <div class="section-label">Alunos (${alunosStats.length})</div>
    <div id="alunosList" style="margin-bottom:32px;"></div>

    <div class="section-label">Atividade para a turma</div>
    <div class="niveau-row" id="niveauRowTurma"></div>
    <textarea class="big" id="aufgabeTurmaInput" placeholder="z.B. 'Schreibe einen Beitrag zum Thema Freundschaft…'" style="width:100%;min-height:100px;border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;font-family:inherit;font-size:0.94rem;margin:10px 0;"></textarea>
    <button class="primary" id="btnPostarAtividade">Enviar atividade</button>

    <div class="section-label" style="margin-top:28px;">Atividades enviadas</div>
    <div id="aufgabenList"></div>

    <div class="section-label" style="margin-top:28px;">entregas dos alunos</div>
    <div id="entregasList"></div>
  `;

  $('btnVoltar').addEventListener('click', renderHome);
  $('codigoBox').addEventListener('click', () => {
    navigator.clipboard?.writeText(turmaAtual.codigo);
    $('codigoBox').style.opacity = '0.6';
    setTimeout(() => $('codigoBox').style.opacity = '1', 200);
  });

  const alunosEl = $('alunosList');
  if (!alunosStats.length) {
    alunosEl.innerHTML = `<div class="ms-empty">Ainda não há alunos. Compartilhe o código acima para que eles possam entrar.</div>`;
  } else {
    alunosEl.innerHTML = alunosStats.map(a => `
      <div>
        <div class="aluno-row">
          <div>
            <div class="email">${escapeHtml(a.nome)}</div>
            <div class="stats">Aufgaben: ${a.entregues}/${a.totalAufgaben} entregues${a.pendentes ? ` · ${a.pendentes} pendentes` : ''} · última: ${a.ultima}${a.historicoCount ? ` · ${a.historicoCount} freie Übungen` : ''}</div>
          </div>
          <div style="display:flex;gap:8px;align-items:center;">
            <span class="badge">${escapeHtml(a.melhor)}</span>
            <button class="btn-sair" data-verlauf="${a.user_id}" style="font-family:inherit;font-size:0.74rem;padding:6px 11px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--ink-soft);cursor:pointer;">Histórico</button>
            <button class="btn-sair" data-reset-senha="${a.user_id}" style="font-family:inherit;font-size:0.74rem;padding:6px 11px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--ink-soft);cursor:pointer;">Redefinir senha</button>
            <button class="btn-sair" data-remover="${a.user_id}" style="font-family:inherit;font-size:0.74rem;padding:6px 11px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--ink-soft);cursor:pointer;">Entfernen</button>
          </div>
        </div>
        <div id="verlauf-${a.user_id}" style="display:none;margin:-4px 0 10px 4px;"></div>
      </div>`).join('');

    alunosEl.querySelectorAll('[data-verlauf]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const uid = btn.dataset.verlauf;
        const wrap = $('verlauf-' + uid);
        const abrindo = wrap.style.display === 'none';
        wrap.style.display = abrindo ? 'block' : 'none';
        if (abrindo && !wrap.dataset.loaded) {
          const registros = historicoTodos.filter(h => h.user_id === uid);
          let entregasAluno = Array.isArray(entregasTurma) ? entregasTurma.filter(e => e.aluno_id === uid) : [];
          // Recarrega as entregas diretamente do banco ao abrir o Histórico.
          // Assim, uma entrega feita depois do carregamento da turma aparece imediatamente.
          try {
            const resAlunoEntregas = await sbFetch(
              `entregas_turma?turma_id=eq.${encodeURIComponent(turmaId)}&aluno_id=eq.${encodeURIComponent(uid)}&select=*&order=enviado_em.desc`
            );
            if (resAlunoEntregas.ok) {
              const dadosAlunoEntregas = await resAlunoEntregas.json();
              if (Array.isArray(dadosAlunoEntregas)) entregasAluno = dadosAlunoEntregas;
            } else {
              console.error('Erro beim Erro ao carregar as entregas dos alunos:', resAlunoEntregas.status, await resAlunoEntregas.text());
            }
          } catch (err) {
            console.error('Erro beim Erro ao carregar as entregas dos alunos:', err);
          }

          const aufgabenMap = new Map((Array.isArray(aufgabenTurma) ? aufgabenTurma : []).map(a => [a.id, a]));
          wrap.dataset.loaded = '1';
          const entregasHtml = entregasAluno.map(e => {
            const aufgabe = aufgabenMap.get(e.tarefa_id);
            const statusLabel = { enviada:'Entregue · wartet auf Correção', em_correcao_ia:'KI korrigiert…', corrigida_ia:'Mit KI korrigiert', corrigida_professora:'Von Professor korrigiert', recusada:'Nicht korrigiert' }[e.status] || e.status;
            return `<div class="hist-card" style="margin-bottom:8px;">
              <div class="hist-top"><span class="hist-thema">${escapeHtml(aufgabe?.aufgabenstellung || 'Atividade')}</span><span class="hist-badge">${escapeHtml(statusLabel)}</span></div>
              <div class="hist-meta">${aufgabe?.niveau ? niveauLabel(aufgabe.niveau) + ' · ' : ''}${e.enviado_em ? new Date(e.enviado_em).toLocaleDateString('de-DE') : ''}</div>
              <div class="quelltext" style="margin-top:8px;white-space:pre-wrap;">${escapeHtml(e.texto || '')}</div>
            </div>`;
          }).join('');
          const historicoHtml = registros.map(r => `
            <div class="hist-card" style="margin-bottom:8px;">
              <div class="hist-top"><span class="hist-thema">${escapeHtml(r.thema || '—')}</span><span class="hist-badge">${escapeHtml(r.nivel_atingido||'—')} · ${escapeHtml(r.status||'—')}</span></div>
              <div class="hist-meta">${niveauLabel(r.niveau)} · ${escapeHtml(r.textsorte||'')} · ${new Date(r.created_at).toLocaleDateString('de-DE')}</div>
              ${r.texto_aluno ? `<div class="quelltext" style="margin-top:8px;">${escapeHtml(r.texto_aluno)}</div>` : ''}
              ${r.tipp ? `<div class="hist-tipp">→ ${escapeHtml(r.tipp)}</div>` : ''}
            </div>`).join('');
          wrap.innerHTML = `<div style="font-size:0.76rem;font-weight:700;color:var(--ink-faint);margin:8px 0;">Entreguee Turmanaufgaben</div>${entregasHtml || '<div class="ms-empty">Keine Turmanaufgaben abgegeben.</div>'}<div style="font-size:0.76rem;font-weight:700;color:var(--ink-faint);margin:14px 0 8px;">Freie Übungen</div>${historicoHtml || '<div class="ms-empty">Keine freien Übungen.</div>'}`;        }
      });
    });

    alunosEl.querySelectorAll('[data-reset-senha]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const uid = btn.dataset.resetSenha;
        const senha = prompt('Digite a nova senha para este aluno (mínimo de 8 caracteres):');
        if (senha === null) return;
        if (senha.length < 8) {
          alert('Das Senha muss mindestens 8 Zeichen lang sein.');
          return;
        }

        btn.disabled = true;
        const textoOriginal = btn.textContent;
        btn.textContent = 'Salvar…';

        try {
          const { data, error } = await supabase.functions.invoke('admin-reset-user-password', {
            body: {
              user_id: uid,
              password: senha
            }
          });

          if (error) {
            let detail = error.message || 'Unbekannter Erro';
            try {
              if (error.context) {
                const payload = await error.context.json();
                detail = payload?.error || payload?.message || detail;
              }
            } catch (_) {}
            throw new Error(detail);
          }

          if (!data?.ok) throw new Error(data?.error || 'Senha konnte nicht zurückgesetzt werden.');

          alert('Senha erfolgreich zurückgesetzt.');
        } catch (e) {
          console.error('Redefinir senha:', e);
          alert('Senha konnte nicht zurückgesetzt werden: ' + (e.message || e));
        } finally {
          btn.disabled = false;
          btn.textContent = textoOriginal;
        }
      });
    });

    alunosEl.querySelectorAll('[data-remover]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Deseja realmente remover este aluno da turma?')) return;
        await sbFetch(`turma_membros?turma_id=eq.${turmaId}&user_id=eq.${btn.dataset.remover}`, { method:'DELETE' });
        abrirTurma(turmaId);
      });
    });
  }

  const NIVEAUS = ['A2','B1','C1'];
  let niveauSelecionado = 'B1';
  const row = $('niveauRowTurma');
  row.innerHTML = NIVEAUS.map(n => `<button class="niveau-btn${n==='B1'?' active':''}" data-n="${n}">${niveauLabel(n)}</button>`).join('');
  row.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      niveauSelecionado = btn.dataset.n;
      row.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  $('btnPostarAtividade').addEventListener('click', async () => {
    const texto = $('aufgabeTurmaInput').value.trim();
    if (!texto) return;
    try {
      await sbFetch('aufgabas_turma', {
        method: 'POST',
        headers: { Prefer: 'return=minimal' },
        body: JSON.stringify({ turma_id: turmaId, niveau: niveauSelecionado, aufgabenstellung: texto })
      });
      $('aufgabeTurmaInput').value = '';
      abrirTurma(turmaId); // recarrega
    } catch(e) { alert('Não foi possível enviar a atividade.'); }
  });

  const aufgabenEl = $('aufgabenList');
  if (!Array.isArray(aufgabenTurma) || !aufgabenTurma.length) {
    aufgabenEl.innerHTML = `<div class="ms-empty">Ainda não há atividades enviadas.</div>`;
  } else {
    aufgabenEl.innerHTML = aufgabenTurma.map(a => `
      <div class="aufgaben-list-item" style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
        <div>
          <div class="meta">${niveauLabel(a.niveau)} · ${new Date(a.created_at).toLocaleDateString('de-DE')}</div>
          ${escapeHtml(a.aufgabenstellung)}
        </div>
        <button data-del-aufgabe="${a.id}" style="flex-shrink:0;font-family:inherit;font-size:0.72rem;padding:5px 10px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--ink-faint);cursor:pointer;">Excluir</button>
      </div>`).join('');

    aufgabenEl.querySelectorAll('[data-del-aufgabe]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Deseja realmente excluir esta atividade?')) return;
        await sbFetch(`aufgabas_turma?id=eq.${btn.dataset.delAtividade}`, { method:'DELETE' });
        abrirTurma(turmaId);
      });
    });
  }

  const nomePorId = new Map(perfis.map(p => [p.user_id, p.nome || 'alunos']));

  const entregasEl = $('entregasList');
  if (!Array.isArray(entregasTurma) || !entregasTurma.length) {
    entregasEl.innerHTML = '<div class="ms-empty">Ainda não há entregas dos alunos.</div>';
  } else {
    entregasEl.innerHTML = entregasTurma.map(e => {
      const aufgabe = Array.isArray(aufgabenTurma) ? aufgabenTurma.find(a => a.id === e.tarefa_id) : null;
      const statusLabel = {
        enviada: 'Wartet auf Correção',
        em_correcao_ia: 'KI korrigiert…',
        corrigida_ia: 'Mit KI korrigiert',
        corrigida_professora: 'Von Professor korrigiert',
        recusada: 'Nicht korrigiert'
      }[e.status] || e.status;
      const feedback = e.feedback || {};
      return `
        <div class="aufgaben-list-item" data-entrega-card="${e.id}">
          <div class="meta">${escapeHtml(nomePorId.get(e.aluno_id) || e.aluno_email || 'alunos')} · ${e.enviado_em ? new Date(e.enviado_em).toLocaleString('de-DE') : ''} · ${escapeHtml(statusLabel)}</div>
          <div style="font-size:0.8rem;color:var(--ink-faint);margin-bottom:8px;">Atividade: ${escapeHtml(aufgabe?.aufgabenstellung || e.tarefa_id)}</div>
          <div style="white-space:pre-wrap;line-height:1.65;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px;font-size:0.92rem;">${escapeHtml(e.texto)}</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;">
            ${e.status === 'enviada' ? `<button class="primary" data-ia-entrega="${e.id}">Correção mit KI</button>` : ''}
            <button class="ghost" data-toggle-feedback="${e.id}">${e.feedback ? 'Feedback anzeigen' : 'Nur ansehen'}</button>
          </div>
          <div id="feedback-entrega-${e.id}" style="display:none;margin-top:12px;"></div>
        </div>`;
    }).join('');

    entregasEl.querySelectorAll('[data-toggle-feedback]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.toggleFeedback;
        const entrega = entregasTurma.find(e => e.id === id);
        const wrap = document.getElementById('feedback-entrega-' + id);
        if (!wrap) return;
        wrap.style.display = wrap.style.display === 'none' ? 'block' : 'none';
        if (wrap.style.display === 'block') {
          if (!entrega?.feedback) {
            wrap.innerHTML = '<div style="font-size:0.84rem;color:var(--ink-soft);">Ainda não há correção por IA. A decisão é sua.</div>';
          } else {
            const fb = entrega.feedback;
            wrap.innerHTML = `
              <div class="hist-card">
                <strong>${escapeHtml(fb.niveau_einschaetzung || fb.status || 'Correção')}</strong>
                <p>${escapeHtml(fb.erfuellung || '')}</p>
                <p>${escapeHtml(fb.aufbau || '')}</p>
                <p>${escapeHtml(fb.sprache || '')}</p>
                <div class="tip-box">→ ${escapeHtml(fb.tipp || '')}</div>
              </div>`;
          }
        }
      });
    });

    entregasEl.querySelectorAll('[data-ia-entrega]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const entrega = entregasTurma.find(e => e.id === btn.dataset.iaEntrega);
        if (!entrega) return;
        if (!confirm('Diesen Text wirklich mit KI korrigieren?')) return;
        btn.disabled = true;
        btn.textContent = 'KI korrigiert…';
        try {
          const aufgabe = Array.isArray(aufgabenTurma) ? aufgabenTurma.find(a => a.id === entrega.tarefa_id) : null;
          const prompt = `Du bist eine erfahrene Deutschlehrkraft. Korrigiere den folgenden alunostext zu dieser von der Professor gestellten Atividade.
Niveau: ${aufgabe?.niveau || 'B1'}
Atividade:
${aufgabe?.aufgabenstellung || ''}

alunostext:
"""
${entrega.texto}
"""

Bewerte kurz Atividadeserfüllung, Aufbau sowie Sprache/Grammatik und nenne maximal 6 konkrete Correções.
Antworte ausschließlich als JSON:
{"niveau_einschaetzung":"...","status":"erreicht|knapp erreicht|noch nicht erreicht","erfuellung":"...","aufbau":"...","sprache":"...","korrekturen":[{"original":"...","korrektur":"...","erklaerung":"..."}],"tipp":"..." }`;
          await sbFetch(`entregas_turma?id=eq.${encodeURIComponent(entrega.id)}`, {
            method:'PATCH',
            headers:{Prefer:'return=minimal'},
            body:JSON.stringify({status:'em_correcao_ia'})
          });
          const response = await fetch(`${SUPABASE_URL}/functions/v1/gemini-proxy`, {
            method:'POST',
            headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+session.access_token},
            body:JSON.stringify({prompt,max_tokens:5000})
          });
          const data = await response.json();
          if (!response.ok || data.error) throw new Error(data.error || 'KI-Erro');
          let raw = String(data.text || '').trim().replace(/^\`\`\`json\s*/,'').replace(/^\`\`\`\s*/,'').replace(/\s*\`\`\`$/,'');
          const feedback = JSON.parse(raw);
          const update = await sbFetch(`entregas_turma?id=eq.${encodeURIComponent(entrega.id)}`, {
            method:'PATCH',
            headers:{Prefer:'return=minimal'},
            body:JSON.stringify({status:'corrigida_ia',feedback,corrigido_em:new Date().toISOString()})
          });
          if (!update.ok) throw new Error(await update.text());
          abrirTurma(turmaId);
        } catch(e) {
          console.error(e);
          await sbFetch(`entregas_turma?id=eq.${encodeURIComponent(entrega.id)}`, {
            method:'PATCH',
            headers:{Prefer:'return=minimal'},
            body:JSON.stringify({status:'enviada'})
          });
          alert('Die KI-Correção konnte nicht durchgeführt werden. Der Text bleibt zur manuellen Entscheidung offen.');
          btn.disabled = false;
          btn.textContent = 'Correção mit KI';
        }
      });
    });
  }
}

init();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js').catch(()=>{}));
}
</script>
</body>
</html>

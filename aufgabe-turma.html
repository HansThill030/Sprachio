<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="robots" content="noindex,nofollow"><script src="js/theme.js"></script><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aufgabe — Sprachio</title><link rel="icon" href="assets/mark.png"><link rel="stylesheet" href="css/styles.css"></head><body><div class="wrap"><div class="hist-loading" id="status">Aufgabe wird geöffnet&hellip;</div></div><script src="js/config.js"></script><script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const cfg=window.SCHREIBTRAINER_CONFIG||{};const sb=createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);const p=new URLSearchParams(location.search);const id=p.get('id');const status=document.getElementById('status');
async function main(){try{const{data:{session}}=await sb.auth.getSession();if(!session){location.href='/login';return}if(!id)throw new Error('Keine Aufgabe angegeben.');const res=await fetch(`${cfg.SUPABASE_URL}/rest/v1/aufgabas_turma?id=eq.${encodeURIComponent(id)}&select=id,turma_id,niveau,aufgabenstellung&limit=1`,{headers:{apikey:cfg.SUPABASE_ANON_KEY,Authorization:'Bearer '+session.access_token}});if(!res.ok)throw new Error(await res.text());const rows=await res.json();const task=rows[0];if(!task)throw new Error('Aufgabe nicht gefunden.');const niveau=['A2','B1','C1'].includes(task.niveau)?task.niveau:'B1';const tipo=niveau==='A2'?'email_informell':niveau==='B1'?'leserbrief':'erörterung_grafik';await fetch(`${cfg.SUPABASE_URL}/rest/v1/rascunhos?user_id=eq.${encodeURIComponent(session.user.id)}`,{method:'DELETE',headers:{apikey:cfg.SUPABASE_ANON_KEY,Authorization:'Bearer '+session.access_token}});const draft={user_id:session.user.id,niveau,tipo_key:tipo,schwierigkeit:4,aufgaba_obj:{aufgabe:task.aufgabenstellung,quelltext:'',thema:task.aufgabenstellung.split(/\n+/)[0].slice(0,120),aufgabe_id:task.id,turma_id:task.turma_id,classroom:true},texto:'',segundos_restantes:null,atualizado_em:new Date().toISOString()};const ins=await fetch(`${cfg.SUPABASE_URL}/rest/v1/rascunhos`,{method:'POST',headers:{apikey:cfg.SUPABASE_ANON_KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(draft)});if(!ins.ok)throw new Error(await ins.text());location.href='/trainer#/config';}catch(e){console.error(e);status.textContent='Die Aufgabe konnte nicht geöffnet werden.';}}
main();
</script></body></html>

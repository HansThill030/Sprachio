<!DOCTYPE html>
<html lang="de">
<head>
<script src="js/consent.js"></script>

<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<script src="js/theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neues Passwort — Sprachio</title>
<link rel="icon" href="assets/mark.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e1b4b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"></noscript>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="wrap" role="main">
  <div class="masthead">
    <a class="brand" href="/">
      <img src="assets/mark.png" alt="Sprachio" width="53" height="60">
      <span><span class="name">SPRACHIO</span></span>
    </a>
  </div>
</div>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="logo-row"><img src="assets/mark.png" alt="Sprachio" width="53" height="60"></div>
    <div class="auth-title">Neues Passwort festlegen</div>
    <div class="auth-sub" id="statusMsg">Einen Moment&hellip;</div>

    <div id="formWrap" style="display:none;">
      <div class="form-group">
        <label>Neues Passwort</label>
        <input type="password" id="inputNovaSenha" placeholder="Mindestens 8 Zeichen">
      </div>
      <button class="auth-btn" id="btnSalvar">Passwort speichern</button>
      <div class="auth-msg" id="authMsg"></div>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = window.SCHREIBTRAINER_CONFIG?.SUPABASE_URL || "";
const SUPABASE_KEY = window.SCHREIBTRAINER_CONFIG?.SUPABASE_ANON_KEY || "";
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
function showMsg(txt, tipo='erro'){
  const el = $('authMsg');
  el.textContent = txt;
  el.className = 'auth-msg ' + tipo;
}

let pronto = false;
supabase.auth.onAuthStateChange((event) => {
  if (event === 'PASSWORD_RECOVERY') {
    pronto = true;
    $('statusMsg').textContent = 'Gib dein neues Passwort ein.';
    $('formWrap').style.display = 'block';
  }
});

// fallback: se já processado ao carregar
setTimeout(async () => {
  if (pronto) return;
  const { data: { session } } = await supabase.auth.getSession();
  if (session) {
    pronto = true;
    $('statusMsg').textContent = 'Gib dein neues Passwort ein.';
    $('formWrap').style.display = 'block';
  } else {
    $('statusMsg').textContent = 'Ungültiger oder abgelaufener Link. Bitte fordere einen neuen an.';
  }
}, 1500);

$('btnSalvar').addEventListener('click', async () => {
  const senha = $('inputNovaSenha').value;
  if (!senha || senha.length < 8) { showMsg('Das Passwort muss mindestens 8 Zeichen enthalten.'); return; }
  $('btnSalvar').disabled = true;
  $('btnSalvar').textContent = 'Speichert…';
  try {
    const { error } = await supabase.auth.updateUser({ password: senha });
    if (error) throw error;
    showMsg('Passwort geändert! Du wirst weitergeleitet…', 'ok');
    setTimeout(() => location.href = '/trainer#/config', 1500);
  } catch(e) {
    showMsg(e.message || 'Fehler beim Speichern.');
    $('btnSalvar').disabled = false;
    $('btnSalvar').textContent = 'Passwort speichern';
  }
});
</script>
</body>
</html>

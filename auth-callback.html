<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script src="js/consent.js"></script>

<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<script src="js/theme.js"></script>
<title>Entrando… — Sprachio</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e1b4b">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"></noscript>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="wrap" role="main" style="text-align:center;padding-top:80px;">
  <div style="font-family:'IBM Plex Mono',monospace;font-size:0.85rem;color:var(--ink-soft);">
    <div class="loading-big"><div class="spin"></div>Processando login&hellip;</div>
  </div>
</div>

<script src="js/config.js"></script>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = window.SCHREIBTRAINER_CONFIG?.SUPABASE_URL || "";
const SUPABASE_KEY = window.SCHREIBTRAINER_CONFIG?.SUPABASE_ANON_KEY || "";
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

// Processa o token que o Supabase envia via URL hash (#access_token=...&type=...)
// onAuthStateChange captura o SIGNED_IN logo após o Supabase processar o hash
async function continuar(session) {
  if (!session) return;
  const { data: perfil } = await supabase.from('perfis').select('role').eq('user_id', session.user.id).maybeSingle();
  if (perfil?.role === 'teacher' || perfil?.role === 'admin') {
    location.href = '/email-verification';
  } else {
    location.href = '/trainer#/config';
  }
}
supabase.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_IN' && session) continuar(session);
});
const { data: { session } } = await supabase.auth.getSession();
if (session) continuar(session);

// Timeout de segurança — se não redirecionar em 5s, volta pro login
setTimeout(() => { location.href = '/login'; }, 5000);
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js').catch(()=>{}));
}
</script>
</body>
</html>

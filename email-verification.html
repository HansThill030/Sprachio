<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script src="js/consent.js"></script>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<script src="js/theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verificação por e-mail — Sprachio</title>
<link rel="icon" href="assets/mark.png">
<link rel="stylesheet" href="css/styles.css">
<style>
.verify-card{max-width:460px;margin:9vh auto 0;text-align:center}
.code-input{font-size:1.5rem!important;letter-spacing:.35em;text-align:center;font-family:"IBM Plex Mono",monospace}
.msg{min-height:24px;margin-top:14px;font-size:.86rem}.ok{color:var(--ok)}.err{color:var(--err)}
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead"><a class="brand" href="/"><img src="assets/mark.png" alt="Sprachio" width="53" height="60"><span><span class="name">SPRACHIO</span><br><span class="sub">Aprenda alemão. Evolua sempre.</span></span></a></div>
  <main class="auth-card verify-card">
    <img src="assets/mark.png" alt="Sprachio" width="53" height="60">
    <h1>Verificação por e-mail</h1>
    <p id="intro">Enviaremos um código de 6 dígitos para o seu e-mail.</p>
    <p id="email" style="font-weight:700;"></p>
    <button class="auth-btn" id="send">Enviar código</button>
    <div id="form" style="display:none;margin-top:18px;">
      <input id="code" class="code-input" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000">
      <button class="auth-btn" id="verify" style="margin-top:12px;">Verificar e continuar</button>
      <button class="ghost" id="resend" style="width:100%;margin-top:10px;">Enviar outro código</button>
    </div>
    <div id="msg" class="msg"></div>
    <button class="ghost" id="logout" style="width:100%;margin-top:12px;">Sair</button>
  </main>
</div>
<script src="js/config.js"></script>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase=createClient(window.SCHREIBTRAINER_CONFIG.SUPABASE_URL,window.SCHREIBTRAINER_CONFIG.SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);
let email='';
function message(t,ok=false){$('msg').textContent=t;$('msg').className='msg '+(ok?'ok':'err');}
async function roleOk(session){
  const {data:p,error}=await supabase.from('perfis').select('role').eq('user_id',session.user.id).maybeSingle();
  if(error) throw error;
  if(!['teacher','admin'].includes(p?.role)){location.href='/trainer-hub';return false;}
  return true;
}
async function sendCode(){
  $('send').disabled=true;$('resend').disabled=true;message('Enviando código…');
  try{
    const {error}=await supabase.auth.signInWithOtp({email,options:{shouldCreateUser:false}});
    if(error) throw error;
    $('form').style.display='block';message('Código enviado. Verifique seu e-mail.',true);$('code').focus();
  }catch(e){message(e.message||'Não foi possível enviar o código.');}
  finally{$('send').disabled=false;$('resend').disabled=false;}
}
async function init(){
  const {data:{session}}=await supabase.auth.getSession();
  if(!session){location.href='/login';return;}
  if(!(await roleOk(session)))return;
  email=session.user.email||'';$('email').textContent=email;
}
$('send').addEventListener('click',sendCode);
$('resend').addEventListener('click',sendCode);
$('verify').addEventListener('click',async()=>{
  const token=$('code').value.trim();
  if(!/^\d{6}$/.test(token)){message('Digite um código de 6 dígitos.');return;}
  $('verify').disabled=true;message('Verificando…');
  try{
    const {data,error}=await supabase.auth.verifyOtp({email,token,type:'email'});
    if(error) throw error;
    if(!data?.session) throw new Error('Não foi possível validar a sessão.');
    if(!(await roleOk(data.session)))return;
    location.href='/professor';
  }catch(e){message(e.message||'Código inválido.');}
  finally{$('verify').disabled=false;}
});
$('code').addEventListener('keydown',e=>{if(e.key==='Enter')$('verify').click();});
$('logout').addEventListener('click',async()=>{await supabase.auth.signOut();location.href='/login';});
init().catch(e=>{console.error(e);message('Não foi possível iniciar a verificação. Entre novamente.');});
</script>
</body>
</html>

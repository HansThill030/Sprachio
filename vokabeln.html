<!DOCTYPE html>
<html lang="de">
<head>
<script src="js/consent.js"></script>

<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<script src="js/theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vokabeln — Sprachio</title>
<link rel="icon" href="assets/mark.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e1b4b">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"></noscript>
<link rel="stylesheet" href="css/styles.css">
<style>
.vok-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;margin-bottom:28px;background:var(--line);border:1px solid var(--line);}
.vok-stats .stat-card{background:var(--card);}

.card-review{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:40px 28px;text-align:center;min-height:220px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;position:relative;
}
.card-review .niveau-tag{
  position:absolute;top:14px;left:16px;
  font-size:0.68rem;font-weight:600;color:var(--ink-faint);
  text-transform:uppercase;letter-spacing:0.05em;
}
.card-review .wort{font-family:'Space Grotesk',sans-serif;font-size:1.8rem;font-weight:700;margin-bottom:10px;}
.card-review .bedeutung{font-size:1.05rem;color:var(--ink-soft);display:none;}
.card-review .beispiel{font-size:0.86rem;color:var(--ink-faint);margin-top:14px;font-style:italic;display:none;}
.card-review .hint{font-size:0.76rem;color:var(--ink-faint);margin-top:20px;}
.card-review.revealed .bedeutung,.card-review.revealed .beispiel{display:block;}

.rating-row{display:none;gap:8px;margin-top:16px;}
.rating-row.show{display:grid;grid-template-columns:repeat(3,1fr);}
.rating-btn{
  font-family:'Space Grotesk',sans-serif;font-size:0.86rem;font-weight:600;
  padding:12px;border-radius:var(--r-sm);cursor:pointer;border:1px solid;
  transition:opacity .15s ease;
}
.rating-btn:hover{opacity:0.85;}
.rating-btn.schwer{background:#fdf1f1;color:var(--err);border-color:#f3c9cb;}
.rating-btn.mittel{background:#fef9ec;color:var(--warn);border-color:#f0ddb0;}
.rating-btn.leicht{background:#eefaf4;color:var(--ok);border-color:#bfe8d5;}

.vok-empty{text-align:center;padding:60px 20px;color:var(--ink-soft);}
.vok-empty .big{font-size:2.4rem;margin-bottom:12px;}

.vok-list-item{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:12px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:12px;
}
.vok-list-item .w{font-weight:600;}
.vok-list-item .b{font-size:0.85rem;color:var(--ink-soft);}
.vok-list-item .prazo{font-size:0.72rem;color:var(--ink-faint);white-space:nowrap;}
</style>
</head>
<body>
<div class="wrap" role="main">

  <div class="masthead">
    <a class="brand" href="/">
      <img src="assets/mark.png" alt="Sprachio" width="53" height="60">
      <span><span class="name">SPRACHIO</span></span>
    </a>
    <div class="header-actions">
      <span id="userEmail" style="font-size:0.8rem;color:var(--ink-faint);"></span>
      <a class="home-link" href="/trainer-hub">← Hub</a>
    </div>
  </div>

  <h2 class="screen-title" style="margin-bottom:6px;">Vocabulário</h2>
  <p style="color:var(--ink-soft);font-size:0.92rem;margin:0 0 24px;">Cartões gerados automaticamente a partir das suas correções, com revisão espaçada.</p>

  <div class="vok-stats">
    <div class="stat-card"><span class="stat-val" id="statFaellig">—</span><span class="stat-lbl">Para revisar hoje</span></div>
    <div class="stat-card"><span class="stat-val" id="statGesamt">—</span><span class="stat-lbl">Total de cartões</span></div>
    <div class="stat-card"><span class="stat-val" id="statGelernt">—</span><span class="stat-lbl">Bem aprendidos</span></div>
  </div>

  <div id="reviewArea"></div>

  <div class="section-label" style="margin-top:36px;">Todos os cartões</div>
  <div id="listArea"></div>

  <div class="disclaimer">Karten werden automatisch aus deinen Korrekturen erstellt.</div>
</div>

<script src="js/config.js"></script>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = window.SCHREIBTRAINER_CONFIG?.SUPABASE_URL || "";
const SUPABASE_KEY = window.SCHREIBTRAINER_CONFIG?.SUPABASE_ANON_KEY || "";
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const { data: { session } } = await supabase.auth.getSession();
if (!session) { location.href = '/login'; }

const $ = id => document.getElementById(id);
function escapeHtml(str){ const d=document.createElement('div'); d.textContent = str || ''; return d.innerHTML; }
const userEl = $('userEmail');
if (userEl && session) userEl.textContent = session.user.email;

function sbFetch(path, options={}){
  const headers=Object.assign({
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + session.access_token,
    'Content-Type':'application/json'
  }, options.headers||{});
  return fetch(`${SUPABASE_URL}/rest/v1/${path}`, Object.assign({}, options, { headers }));
}

let todasCartas = [];
let filaRevisao = [];
let cartaAtual = null;
let revelada = false;

async function carregar(){
  try {
    const res = await sbFetch('vocabulario?select=*&order=proxima_revisao.asc');
    todasCartas = await res.json();
    if (!Array.isArray(todasCartas)) todasCartas = [];
  } catch(e) { todasCartas = []; }

  const hoje = new Date().toISOString().slice(0,10);
  filaRevisao = todasCartas.filter(c => c.proxima_revisao <= hoje);

  renderStats(hoje);
  renderReview();
  renderList();
}

function renderStats(hoje){
  $('statFaellig').textContent = filaRevisao.length;
  $('statGesamt').textContent = todasCartas.length;
  $('statGelernt').textContent = todasCartas.filter(c => c.intervalo_dias >= 14).length;
}

function renderReview(){
  const area = $('reviewArea');
  if (!filaRevisao.length) {
    area.innerHTML = `<div class="vok-empty"><div class="big">✅</div>Nenhum cartão para revisar hoje.<br>Novos cartões são criados automaticamente após as correções.</div>`;
    return;
  }
  cartaAtual = filaRevisao[0];
  revelada = false;
  area.innerHTML = `
    <div class="card-review" id="cardReview">
      <span class="niveau-tag">${escapeHtml(cartaAtual.niveau || '')}</span>
      <div class="wort">${escapeHtml(cartaAtual.wort)}</div>
      <div class="bedeutung">${escapeHtml(cartaAtual.bedeutung)}</div>
      ${cartaAtual.beispiel ? `<div class="beispiel">„${escapeHtml(cartaAtual.beispiel)}"</div>` : ''}
      <div class="hint" id="cardHint">Tippen, um die Bedeutung zu zeigen</div>
    </div>
    <div class="rating-row" id="ratingRow">
      <button class="rating-btn schwer" data-r="schwer">😓 Schwer</button>
      <button class="rating-btn mittel" data-r="mittel">🙂 Mittel</button>
      <button class="rating-btn leicht" data-r="leicht">😎 Leicht</button>
    </div>
  `;
  $('cardReview').addEventListener('click', () => {
    if (revelada) return;
    revelada = true;
    $('cardReview').classList.add('revealed');
    $('cardHint').textContent = `${filaRevisao.length} Karte(n) übrig`;
    $('ratingRow').classList.add('show');
  });
  document.querySelectorAll('.rating-btn').forEach(btn => {
    btn.addEventListener('click', (e) => { e.stopPropagation(); avaliar(btn.dataset.r); });
  });
}

/* SRS simplificado: schwer -> reseta pra 1 dia; mittel -> intervalo * 1.5; leicht -> intervalo * ease (2.5) */
async function avaliar(nivel){
  const carta = cartaAtual;
  let novoIntervalo = carta.intervalo_dias || 1;
  let novoFator = carta.fator_facilidade || 2.5;

  if (nivel === 'schwer') { novoIntervalo = 1; novoFator = Math.max(1.3, novoFator - 0.2); }
  else if (nivel === 'mittel') { novoIntervalo = Math.max(1, Math.round(novoIntervalo * 1.5)); }
  else { novoIntervalo = Math.max(2, Math.round(novoIntervalo * novoFator)); novoFator = novoFator + 0.1; }

  const proxima = new Date();
  proxima.setDate(proxima.getDate() + novoIntervalo);

  try {
    await sbFetch(`vocabulario?id=eq.${carta.id}`, {
      method: 'PATCH',
      headers: { Prefer: 'return=minimal' },
      body: JSON.stringify({
        intervalo_dias: novoIntervalo,
        fator_facilidade: novoFator,
        proxima_revisao: proxima.toISOString().slice(0,10)
      })
    });
  } catch(e) { console.warn(e); }

  filaRevisao.shift();
  renderStats(new Date().toISOString().slice(0,10));
  renderReview();
}

function renderList(){
  const area = $('listArea');
  if (!todasCartas.length) {
    area.innerHTML = `<div class="vok-empty">Ainda não há cartões de vocabulário. Eles serão criados automaticamente após suas correções.</div>`;
    return;
  }
  area.innerHTML = todasCartas.map(c => `
    <div class="vok-list-item">
      <div>
        <div class="w">${escapeHtml(c.wort)}</div>
        <div class="b">${escapeHtml(c.bedeutung)}</div>
      </div>
      <div class="prazo">${new Date(c.proxima_revisao).toLocaleDateString('de-DE')}</div>
    </div>`).join('');
}

carregar();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js').catch(()=>{}));
}
</script>
</body>
</html>

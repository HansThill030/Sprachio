<!DOCTYPE html>
<html lang="de"><head><script src="js/consent.js"></script><meta charset="UTF-8"><meta name="robots" content="noindex, nofollow"><script src="js/theme.js"></script><meta name="viewport" content="width=device-width, initial-scale=1"><title>Meine Klassen — Sprachio</title><link rel="icon" href="assets/mark.png"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1e1b4b"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="preload" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap"></noscript><link rel="stylesheet" href="css/styles.css"><style>.turma-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:18px}.turma-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:14px}.turma-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.05rem}.turma-code{font-size:.76rem;color:var(--ink-faint);margin-top:3px}.btn-sair{font-family:inherit;font-size:.78rem;font-weight:600;padding:7px 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:transparent;color:var(--ink-soft);cursor:pointer}.btn-sair:hover{border-color:var(--err);color:var(--err)}.aufgaben-title{font-family:'Space Grotesk',sans-serif;font-size:.9rem;font-weight:700;margin:16px 0 10px}.aufgabe-item{border:1px solid var(--line);border-radius:var(--r-sm);padding:14px 16px;margin-top:9px;background:var(--bg,var(--card))}.aufgabe-item .meta{font-size:.74rem;color:var(--ink-faint);margin-bottom:6px}.aufgabe-item .text{font-size:.9rem;line-height:1.55;color:var(--ink);white-space:pre-wrap}.aufgaben-empty{font-size:.82rem;color:var(--ink-faint);padding:8px 0}.aufgaben-error{font-size:.82rem;color:var(--err);padding:8px 0}.aufgabe-actions{display:flex;justify-content:flex-end;margin-top:12px}.btn-aufgabe{font-family:inherit;font-size:.82rem;font-weight:700;padding:9px 15px;border:0;border-radius:var(--r-sm);background:var(--ink);color:var(--card);cursor:pointer}.btn-aufgabe:hover{opacity:.88}</style></head><body><div class="wrap" role="main"><div class="masthead"><a class="brand" href="/"><img src="assets/mark.png" alt="Sprachio" width="53" height="60"><span><span class="name">SPRACHIO</span></span></a><div class="header-actions"><span id="userEmail" style="font-size:.8rem;color:var(--ink-faint);"></span><a class="home-link" href="/trainer-hub">← Hub</a></div></div><h2 class="screen-title" style="margin-bottom:6px;">Meine Klassen</h2><p style="color:var(--ink-soft);font-size:.92rem;margin:0 0 24px;">Klassen, denen du über einen Code beigetreten bist.</p><div id="listaTurmas"><div class="hist-loading">Laden&hellip;</div></div></div><script src="js/config.js"></script><script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const U=window.SCHREIBTRAINER_CONFIG?.SUPABASE_URL||'',K=window.SCHREIBTRAINER_CONFIG?.SUPABASE_ANON_KEY||'',supabase=createClient(U,K);const{data:{session}}=await supabase.auth.getSession();if(!session){location.href='/login';}const $=id=>document.getElementById(id);const esc=s=>{const d=document.createElement('div');d.textContent=s??'';return d.innerHTML};$('userEmail').textContent=session.user.email;const fetchSB=(p,o={})=>fetch(`${U}/rest/v1/${p}`,Object.assign({},o,{headers:Object.assign({apikey:K,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},o.headers||{})}));async function aufgaben(tid){try{const r=await fetchSB(`aufgabas_turma?turma_id=eq.${encodeURIComponent(tid)}&select=id,turma_id,niveau,aufgabenstellung,created_at&order=created_at.desc`);if(!r.ok)throw Error(await r.text());const a=await r.json();if(!a.length)return'<div class="aufgaben-empty">Noch keine Aufgaben für diese Klasse.</div>';return a.map(x=>`<div class="aufgabe-item"><div class="meta">${esc(x.niveau||'')} · ${x.created_at?new Date(x.created_at).toLocaleDateString('de-DE'):''}</div><div class="text">${esc(x.aufgabenstellung)}</div><div class="aufgabe-actions"><button class="btn-aufgabe" data-aufgabe="${esc(x.id)}">Aufgabe bearbeiten →</button></div></div>`).join('')}catch(e){console.error(e);return'<div class="aufgaben-error">Aufgaben konnten nicht geladen werden.</div>'}}async function load(){const el=$('listaTurmas');try{const rm=await fetchSB(`turma_membros?user_id=eq.${encodeURIComponent(session.user.id)}&select=turma_id`);if(!rm.ok)throw Error(await rm.text());const m=await rm.json();if(!m.length){el.innerHTML='<div class="ms-empty">Du bist noch keiner Klasse beigetreten.</div>';return}const ids=m.map(x=>`"${x.turma_id}"`).join(',');const rt=await fetchSB(`turmas?id=in.(${ids})&select=id,nome,codigo`);if(!rt.ok)throw Error(await rt.text());const ts=await rt.json();el.innerHTML=ts.map(t=>`<div class="turma-card"><div class="turma-head"><div><div class="turma-name">${esc(t.nome)}</div><div class="turma-code">Code: ${esc(t.codigo)}</div></div><button class="btn-sair" data-id="${esc(t.id)}">Verlassen</button></div><div class="aufgaben-title">📚 Aufgaben</div><div class="aufgaben-list" data-for="${esc(t.id)}"><div class="hist-loading">Laden&hellip;</div></div></div>`).join('');await Promise.all(ts.map(async t=>{const z=el.querySelector(`[data-for="${CSS.escape(String(t.id))}"]`);if(z)z.innerHTML=await aufgaben(t.id)}));el.querySelectorAll('.btn-aufgabe').forEach(b=>b.onclick=()=>location.href=`/aufgabe-turma?id=${encodeURIComponent(b.dataset.aufgabe)}`);el.querySelectorAll('.btn-sair').forEach(b=>b.onclick=async()=>{if(!confirm('Diese Klasse wirklich verlassen?'))return;const r=await fetchSB(`turma_membros?turma_id=eq.${encodeURIComponent(b.dataset.id)}&user_id=eq.${encodeURIComponent(session.user.id)}`,{method:'DELETE'});if(!r.ok){alert('Klasse konnte nicht verlassen werden.');return}load()})}catch(e){console.error(e);el.innerHTML='<div class="ms-empty">Fehler beim Laden. Bitte versuche es erneut.</div>'}}load();</script><script>if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js').catch(()=>{}))}</script></body></html>
